name: wiki-sync
# Publishes docs/wiki/ to this repository's GitHub wiki. The pages are written
# and reviewed in the repository like any other docs; this job copies them to
# the wiki after they reach main, so the wiki is never edited by hand.
# The wiki must exist first: create any page once in the GitHub UI (Wiki tab),
# then run this workflow (Actions tab → wiki-sync → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:
concurrency:
  group: wiki-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Clone the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki repository is not there yet. Open the Wiki tab, create any first page, then re-run this workflow."
            exit 1
          fi
      - name: Copy pages
        run: rsync -a --delete --exclude '.git' docs/wiki/ wiki/
      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date."; exit 0; fi
          git commit -q -m "Sync wiki from ${GITHUB_SHA::7}"
          git push -q origin HEAD
